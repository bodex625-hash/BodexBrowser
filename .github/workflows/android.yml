name: Build H.B Proxy and HB Browser APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/vpn-engine-integration, integration/proxy-plus-companion-browser ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download and verify Hev SOCKS5 tunnel AAR
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/hev-socks5-tunnel.aar https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.3/hev-socks5-tunnel.aar
          echo "ab6c581e6157680cfe5687ee7bbdcf95405c006c2db3701879ec44b9e5f83836  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      - name: Build both applications
        run: gradle --no-daemon :app:assembleDebug :browser:assembleDebug

      - name: Upload H.B Proxy APK
        uses: actions/upload-artifact@v4
        with:
          name: HB-Proxy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload HB Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: HB-Browser-debug-apk
          path: browser/build/outputs/apk/debug/browser-debug.apk
          if-no-files-found: error
