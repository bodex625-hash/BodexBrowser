name: Build H.B Proxy and HB Browser APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [ feature/vpn-engine-integration, integration/proxy-plus-companion-browser ]
  push:
    branches: [ main, master, feature/vpn-engine-integration, integration/proxy-plus-companion-browser, feature/hb-browser-site-language-build130 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # The published API 37 platform directory is named android-37.0,
          # while AGP resolves compileSdk 37 through android-37.
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Download and verify Hev SOCKS5 tunnel AAR
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/hev-socks5-tunnel.aar https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.3/hev-socks5-tunnel.aar
          echo "ab6c581e6157680cfe5687ee7bbdcf95405c006c2db3701879ec44b9e5f83836  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      - name: Prepare shared signing key
        id: signing
        env:
          HB_SHARED_KEYSTORE_BASE64: ${{ secrets.HB_SHARED_KEYSTORE_BASE64 }}
          HB_STORE_PASSWORD: ${{ secrets.HB_STORE_PASSWORD }}
          HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
          HB_KEY_PASSWORD: ${{ secrets.HB_KEY_PASSWORD }}
        run: |
          if [ -n "$HB_SHARED_KEYSTORE_BASE64" ] && [ -n "$HB_STORE_PASSWORD" ] && [ -n "$HB_KEY_ALIAS" ] && [ -n "$HB_KEY_PASSWORD" ]; then
            printf '%s' "$HB_SHARED_KEYSTORE_BASE64" | base64 --decode > shared-signing.jks
            echo "status=shared-signed" >> "$GITHUB_OUTPUT"
          else
            echo "status=debug-signed-not-for-install" >> "$GITHUB_OUTPUT"
            echo "::warning::Shared signing secrets are not configured. These APKs are test builds and must not replace installed apps."
          fi

      - name: Build both applications
        env:
          HB_STORE_PASSWORD: ${{ secrets.HB_STORE_PASSWORD }}
          HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
          HB_KEY_PASSWORD: ${{ secrets.HB_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :browser:assembleDebug

      - name: Upload H.B Proxy APK
        uses: actions/upload-artifact@v4
        with:
          name: HB-Proxy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload HB Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: HB-Browser-debug-apk
          path: browser/build/outputs/apk/debug/browser-debug.apk
          if-no-files-found: error
