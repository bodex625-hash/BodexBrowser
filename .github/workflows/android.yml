name: Build H.B Proxy with HB Browser

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/vpn-engine-integration, integration/hb-browser-in-proxy ]

permissions:
  contents: read

concurrency:
  group: integrated-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Download and verify Hev SOCKS5 tunnel AAR
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/hev-socks5-tunnel.aar https://github.com/heiher/hev-socks5-tunnel/releases/download/2.19.3/hev-socks5-tunnel.aar
          echo "ab6c581e6157680cfe5687ee7bbdcf95405c006c2db3701879ec44b9e5f83836  app/libs/hev-socks5-tunnel.aar" | sha256sum -c -

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HB-Proxy-Browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
