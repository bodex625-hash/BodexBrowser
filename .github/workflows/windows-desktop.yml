name: Windows desktop build

on:
  push:
    branches: [feature/windows-proxy-client]
    paths:
      - "windows/**"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and publish desktop shell
        run: dotnet publish windows/HBProxy.Windows.csproj -c Release -r win-x64 --self-contained false -o publish
      - name: Download pinned HEV engine and Wintun
        uses: actions/download-artifact@v4
        with:
          name: hev-windows-x64-engine
          repository: bodex625-hash/BodexBrowser
          run-id: 43454551076
          github-token: ${{ github.token }}
          path: engine
      - name: Package HEV engine beside the application
        shell: pwsh
        run: Copy-Item -Path "engine/*" -Destination "publish/" -Recurse -Force
      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v4
        with:
          name: hb-proxy-windows-x64-shell
          path: publish/**
          if-no-files-found: error
