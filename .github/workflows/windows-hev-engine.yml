name: Build Windows HEV engine

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-proxy-client
    paths:
      - '.github/workflows/windows-hev-engine.yml'

permissions:
  contents: read

jobs:
  build-hev-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Prepare Visual Studio x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install GNU Make and LLVM
        shell: pwsh
        run: |
          choco install make llvm -y --no-progress
          $env:PATH += ';C:\Program Files\LLVM\bin;C:\Program Files\Git\usr\bin'
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          where.exe clang
          where.exe make
          where.exe sh

      - name: Checkout pinned HEV source and submodules
        shell: pwsh
        run: |
          git clone https://github.com/heiher/hev-socks5-tunnel.git hev-socks5-tunnel
          if ($LASTEXITCODE -ne 0) { throw 'HEV source checkout failed' }
          git -C hev-socks5-tunnel checkout 75dbc1e9ace6c70d3d1b94df7c283efe1de7effc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned HEV revision checkout failed' }
          git -C hev-socks5-tunnel submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'HEV submodule checkout failed' }
          "HEV_SOURCE_COMMIT=75dbc1e9ace6c70d3d1b94df7c283efe1de7effc" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native Windows x64 executable
        shell: pwsh
        working-directory: hev-socks5-tunnel
        run: |
          make ARCH=x64
          if ($LASTEXITCODE -ne 0) { throw 'HEV Windows x64 build failed' }
          if (!(Test-Path 'bin/hev-socks5-tunnel.exe')) { throw 'Expected executable was not produced' }
          dumpbin /headers bin/hev-socks5-tunnel.exe | Select-String '8664 machine'
          if ($LASTEXITCODE -ne 0) { throw 'HEV executable is not verified as x64 PE' }

      - name: Record binary hash and upload engine artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item hev-socks5-tunnel/bin/hev-socks5-tunnel.exe dist/
          Copy-Item hev-socks5-tunnel/third-part/wintun/bin/amd64/wintun.dll dist/wintun.dll
          if (!(Test-Path 'dist/wintun.dll')) { throw 'Matching x64 Wintun DLL was not produced or found' }
          dumpbin /headers dist/wintun.dll | Select-String '8664 machine'
          if ($LASTEXITCODE -ne 0) { throw 'Wintun DLL is not verified as x64 PE' }
          $hash = (Get-FileHash dist/hev-socks5-tunnel.exe -Algorithm SHA256).Hash
          "SHA256  $hash" | Tee-Object -FilePath dist/SHA256.txt
          "HEV source commit: $env:HEV_SOURCE_COMMIT" | Write-Host
          "HEV binary SHA256: $hash" | Write-Host
          @"
          HEV SOCKS5 tunnel engine
          Source: https://github.com/heiher/hev-socks5-tunnel
          Source commit: $env:HEV_SOURCE_COMMIT
          Architecture: Windows x64
          Binary SHA256: $hash
          Note: this artifact is the engine only, not the H.B Proxy application.
          Matching official Wintun x64 DLL is included beside the engine.
          The H.B Proxy controller and safe route orchestration are still required.
          "@ | Out-File dist/BUILD-INFO.txt -Encoding utf8

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: hev-windows-x64-engine
          path: dist/
          if-no-files-found: error
